<!doctype html>
<html><head><meta charset="utf-8">
<!-- MotorPal teaser clip, 1080 x 1920, 9 seconds: the website's neon pulse runs across and traces the car;
     faint neon icons (calendar, chart, warning lights, fuel, battery) drift in behind it. No logo or name.
     Every frame is drawn by seek(t); render-clip.js steps through it. Open in a browser to watch it play. -->
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1920px;overflow:hidden;background:#030B08}
#grid{position:absolute;inset:-80px;background:
  linear-gradient(rgba(0,196,127,.05) 1px,transparent 1px) 0 0/40px 40px,
  linear-gradient(90deg,rgba(0,196,127,.05) 1px,transparent 1px) 0 0/40px 40px}
#vig{position:absolute;inset:0;background:radial-gradient(900px 1100px at 50% 1000px,transparent 25%,rgba(3,11,8,.9) 80%)}
#scan{position:absolute;left:0;right:0;height:220px;background:linear-gradient(transparent,rgba(0,196,127,.05),transparent)}
svg{position:absolute;inset:0}
#black{position:absolute;inset:0;background:#000;opacity:0}
</style></head>
<body>
<div id="grid"></div><div id="scan"></div>
<svg width="1080" height="1920" viewBox="0 0 1080 1920">
  <defs>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="3.2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="iglow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation=".6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="soft" filterUnits="userSpaceOnUse" x="0" y="0" width="2400" height="400"><feGaussianBlur stdDeviation="8"/></filter>
    <radialGradient id="halo"><stop offset="0" stop-color="#00C47F" stop-opacity=".22"/><stop offset="1" stop-color="#00C47F" stop-opacity="0"/></radialGradient>
    <radialGradient id="dotg"><stop offset="0" stop-color="#7CF5C8" stop-opacity=".9"/><stop offset="1" stop-color="#00C47F" stop-opacity="0"/></radialGradient>
    <radialGradient id="lamp" cx="0" cy=".5" r="1"><stop offset="0" stop-color="#7CF5C8" stop-opacity=".35"/><stop offset="1" stop-color="#00C47F" stop-opacity="0"/></radialGradient>
  </defs>
  <g id="icons"></g>
  <ellipse id="halo" cx="540" cy="960" rx="520" ry="300" fill="url(#halo)"/>
  <g id="world">
    <path id="beam" d="M1127 62 L1178 50 L1178 78 Z" fill="url(#lamp)"/>
    <path id="trace" fill="none" stroke="#00C47F" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round" filter="url(#glow)"/>
    <path id="carGlow" fill="none" stroke="#3EE0A4" stroke-width="1.7" stroke-linejoin="round" stroke-linecap="round" filter="url(#glow)"/>
    <circle class="wheel" cx="862" cy="78" r="15" fill="none" stroke="#00C47F" stroke-width="1.5" filter="url(#glow)"/>
    <circle class="wheel" cx="1068" cy="78" r="15" fill="none" stroke="#00C47F" stroke-width="1.5" filter="url(#glow)"/>
    <path id="tail" fill="none" stroke="#00C47F" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" filter="url(#soft)"/>
    <path id="head" fill="none" stroke="#C9FFE9" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>
    <circle id="dotHalo" r="16" fill="url(#dotg)"/><circle id="dot" r="3.4" fill="#F0FFF8"/>
  </g>
</svg>
<div id="vig"></div><div id="black"></div>
<script>
const $ = id => document.getElementById(id);
// The pulse in the website's own coordinates (baseline y = 80; the car runs from x = 800 to 1127), shown at 2x.
const SC = 2, CX = 963.5, BASE = 80, SCREEN_Y = 1020;
$('world').setAttribute('transform', `translate(${540 - CX * SC} ${SCREEN_Y - BASE * SC}) scale(${SC})`);
const ecg = x => `L${x} ${BASE} q6 -7 12 0 L${x + 22} ${BASE} l5 7 l7 -44 l7 54 l6 -17 L${x + 56} ${BASE} q11 -12 22 0`;
const CAR = `L800 ${BASE} L806 ${BASE} L806 64 Q807 56 818 54 L858 52 L892 33 Q900 27 912 26 L992 26 Q1004 27 1014 33 L1052 51 L1106 55 Q1124 58 1126 66 L1127 ${BASE}`;
const D = `M640 ${BASE} ${ecg(694)} ${CAR} ${ecg(1148)} L1300 ${BASE}`;
['trace', 'tail', 'head'].forEach(id => $(id).setAttribute('d', D));
$('carGlow').setAttribute('d', `M800 ${BASE} ${CAR}`);
const L = $('head').getTotalLength(), CL = $('carGlow').getTotalLength();
let c0 = 0; while ($('head').getPointAtLength(c0).x < 800) c0 += 1;
const c1 = c0 + CL;

// Faint neon icons behind the car (24 x 24 line drawings), each with where it sits, its size and when it appears.
const IC = {
  calendar: '<rect x="3.5" y="5" width="17" height="15.5" rx="2.5"/><path d="M3.5 10h17M8 3v4M16 3v4"/><path d="M7.5 13.5h2M11 13.5h2M14.5 13.5h2M7.5 17h2M11 17h2"/>',
  chart: '<path d="M3.5 3.5v17h17"/><path d="M6.5 16l4-5 3.5 3 5.5-7"/><circle cx="19.5" cy="7" r="1.2"/>',
  engine: '<path d="M5 9.5h2.5V7.5h4V6h3v1.5h2.5l2 2h2.5v6H19l-2 2.5H8.5l-2-2.5H5z"/><path d="M2.5 10.5v4.5M5 12.5H2.5"/>',
  oil: '<path d="M3 10.5h8.5l2.5 2.5h3.5l3-3v6.5a1 1 0 0 1-1 1H6a3 3 0 0 1-3-3z"/><path d="M7 10.5V8h4M8 8V6.5h2M20.5 5.5c0 1.2.9 1.7.9 2.6a.9.9 0 0 1-1.8 0c0-.9.9-1.4.9-2.6z"/>',
  fuel: '<path d="M4 20V5a2 2 0 0 1 2-2h6a2 2 0 0 1 2 2v15M3 20h12M14 9h2.5a1.5 1.5 0 0 1 1.5 1.5V16a1.5 1.5 0 0 0 3 0V8l-3-3"/><path d="M7 7h4"/>',
  battery: '<rect x="3" y="7" width="18" height="12" rx="2"/><path d="M7 7V5h3v2M14 7V5h3v2M7 13h3M15.5 11.5v3M14 13h3"/>',
  tyre: '<path d="M7 5.5C4 8 3.5 13 5.5 16.5l1.5 2h10l1.5-2c2-3.5 1.5-8.5-1.5-11"/><path d="M12 8.5v4.5M12 15.5v.2"/>'
};
const PLACE = [
  ['calendar', 170, 470, 190, -8, 1.7], ['chart', 880, 430, 200, 6, 2.1], ['engine', 150, 1430, 180, 5, 2.6],
  ['oil', 900, 1460, 170, -6, 3.0], ['fuel', 300, 700, 120, 4, 3.4], ['battery', 820, 760, 120, -4, 3.7], ['tyre', 560, 1620, 150, 0, 4.0]];
$('icons').innerHTML = PLACE.map(([n, x, y, s, r], i) => `<g id="ic${i}" transform="translate(${x} ${y}) rotate(${r}) scale(${s / 24}) translate(-12 -12)"><g class="ici" fill="none" stroke="#00C47F" stroke-width="${1.3 * 24 / s * 1.6}" stroke-linecap="round" stroke-linejoin="round" filter="url(#iglow)">${IC[n]}</g></g>`).join('');
const icons = PLACE.map((p, i) => ({ p, el: $('ic' + i), inner: $('ic' + i).firstChild }));
icons.forEach(o => o.inner.querySelectorAll('path,rect,circle').forEach(e => { const l = e.getTotalLength ? e.getTotalLength() : 60; e.style.strokeDasharray = l; e.dataset.l = l; }));

const cl = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
const k = (t, t0, t1) => cl((t - t0) / (t1 - t0));
const out = p => 1 - Math.pow(1 - p, 3);
const T = { start: .6, carIn: 1.7, carOut: 4.0, end: 5.0, fade: 8.3, len: 9 };
function headAt(t) {
  if (t < T.start) return -1;
  if (t < T.carIn) return c0 * k(t, T.start, T.carIn);
  if (t < T.carOut) return c0 + CL * k(t, T.carIn, T.carOut);
  if (t < T.end) return c1 + (L - c1) * k(t, T.carOut, T.end);
  return L + 200;
}
function dash(id, len, at, op) { const el = $(id); el.style.strokeDasharray = `${len} ${L * 3}`; el.style.strokeDashoffset = len - at; el.style.opacity = op; }
window.seek = function (t) {
  $('grid').style.opacity = .3 + .7 * out(k(t, 0, 1));
  $('grid').style.transform = `translate(${-(t * 16) % 40}px, 0)`;
  $('scan').style.top = (-240 + ((t * 240) % 2200)) + 'px';
  const h = headAt(t);
  // the line stays drawn behind the dot; the dot and its bright head make one pass
  $('trace').style.strokeDasharray = `${L} ${L}`;
  $('trace').style.strokeDashoffset = h < 0 ? L : L - Math.min(L, h);
  $('trace').style.opacity = h < 0 ? 0 : .75;
  const on = h >= 0 && h <= L;
  dash('head', 34, h, on ? 1 : 0); dash('tail', 170, h, on ? .6 : 0);
  if (on) { const p = $('head').getPointAtLength(Math.min(h, L - .1)); ['dot', 'dotHalo'].forEach(id => { $(id).setAttribute('cx', p.x); $(id).setAttribute('cy', p.y); }); }
  $('dot').style.opacity = on ? 1 : 0; $('dotHalo').style.opacity = on ? 1 : 0;
  // the car brightens once its outline is drawn and then breathes gently; the wheels light as the dot passes
  const carP = cl((h - c0) / CL);
  $('carGlow').style.strokeDasharray = CL; $('carGlow').style.strokeDashoffset = CL * (1 - carP);
  const breathe = t > T.carOut ? .82 + .18 * Math.sin((t - T.carOut) * 2.4) : 1;
  $('carGlow').style.opacity = h < c0 ? 0 : breathe;
  document.querySelectorAll('.wheel').forEach((w, i) => { const at = i ? .78 : .2; const p = out(cl((carP - at) / .12)); w.style.opacity = p * breathe; w.setAttribute('r', 15 * (.6 + .4 * p)); });
  $('beam').style.opacity = .9 * out(k(t, 4.2, 5.2)) * breathe;
  $('halo').style.opacity = out(k(t, 2.4, 4.6)) * (.8 + .2 * Math.sin(t * 2));
  // icons draw themselves in very faintly, then float
  icons.forEach(({ p, el, inner }, i) => {
    const [, x, y, s, r, t0] = p, a = out(k(t, t0, t0 + 1.4));
    inner.querySelectorAll('path,rect,circle').forEach(e => e.style.strokeDashoffset = e.dataset.l * (1 - out(k(t, t0, t0 + 1.8))));
    el.style.opacity = .16 * a + .03 * Math.sin(t * 1.3 + i) * a;
    el.setAttribute('transform', `translate(${x + 6 * Math.sin(t * .5 + i)} ${y - 18 * a - 8 * Math.sin(t * .6 + i * 2)}) rotate(${r}) scale(${s / 24}) translate(-12 -12)`);
  });
  $('black').style.opacity = k(t, T.fade, T.len);
};
seek(0);
if (!location.search.includes('still')) { const st = performance.now(); (function f() { seek(((performance.now() - st) / 1000) % T.len); requestAnimationFrame(f); })(); }
</script>
</body></html>
