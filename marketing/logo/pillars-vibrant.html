<!doctype html>
<html><head><meta charset="utf-8">
<!-- MotorPal: five modern logo directions, each with its own colours and typeface. make-modern.js renders this. -->
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@700;800&family=Space+Grotesk:wght@700&family=Outfit:wght@700;800&family=Manrope:wght@800&family=Unbounded:wght@700&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{width:2740px;font-family:"Plus Jakarta Sans",system-ui,sans-serif;-webkit-font-smoothing:antialiased;background:#F4F4F6;color:#0B0B0F;padding:80px 90px 90px}
h1{font-size:64px;font-weight:800;letter-spacing:-.03em}
.lead{margin-top:12px;font-size:28px;color:#5B5F6A;font-weight:500}
.cols{margin-top:56px;display:grid;grid-template-columns:repeat(4,1fr);gap:32px}
.col{background:#fff;border-radius:40px;overflow:hidden;box-shadow:0 1px 2px rgba(0,0,0,.04),0 18px 36px -14px rgba(0,0,0,.18);display:flex;flex-direction:column}
.hero{display:grid;place-items:center;padding:56px 0}
.hero svg{width:260px;height:260px;filter:drop-shadow(0 24px 36px rgba(0,0,0,.22))}
.lock{display:flex;align-items:center;justify-content:center;gap:16px;padding:30px 0}
.lock svg{width:64px;height:64px;flex:none}
.lock span{font-size:50px;line-height:1}
.sizes{display:flex;align-items:center;justify-content:center;gap:20px;padding:6px 0 28px}
.sw{display:flex;gap:10px;padding:0 32px}
.sw i{flex:1;height:54px;border-radius:14px;display:flex;align-items:flex-end;padding:0 0 8px 10px;font-style:normal;font-size:15px;font-weight:700}
.cap{padding:24px 32px 34px}
.cap small{font-size:20px;font-weight:700;color:#8A8F99}
.cap b{display:block;margin-top:4px;font-size:32px;font-weight:800;letter-spacing:-.02em}
.cap p{margin-top:10px;font-size:23px;line-height:1.42;color:#474B55;font-weight:500}
</style></head>
<body>

"282\" r=\"30\" fill=\"#111111\"/>", "pal": "#E10600", "palDark": "#FF4D45", "dark": "#111111", "hero": "#FFE9E8", "sw": [["#E10600", "#fff"], ["#FFFFFF", "#E10600"], ["#111111", "#fff"], ["#FF4D45", "#111111"]]}, {"tag": "Option 13", "name": "Tangerine", "why": "Bright tangerine with a white dial and dark needle. Warm, cheerful and friendly.", "svg": "<rect width=\"512\" height=\"512\" rx=\"120\" fill=\"#FF6B00\"/><path d=\"M134.38 403.62 A172.0 172.0 0 0 1 90.76 234.26 L133.03 246.47 A128.0 128.0 0 0 0 165.49 372.51 Z\" fill=\"#FFFFFF\"/><path d=\"M99.51 210.62 A172.0 172.0 0 0 1 242.91 110.50 L246.26 154.37 A128.0 128.0 0 0 0 139.54 228.88 Z\" fill=\"#FFFFFF\"/><path d=\"M268.11 110.43 A172.0 172.0 0 0 1 412.08 209.73 L372.15 228.22 A128.0 128.0 0 0 0 265.01 154.32 Z\" fill=\"#FFFFFF\"/><path d=\"M420.97 233.31 A172.0 172.0 0 0 1 378.32 402.92 L347.03 371.99 A128.0 128.0 0 0 0 378.76 245.77 Z\" fill=\"#FFFFFF\"/><path d=\"M256 282 L352 232\" stroke=\"#1A1A1A\" stroke-width=\"28\" stroke-linecap=\"round\"/><circle cx=\"256\" cy=\"282\" r=\"30\" fill=\"#1A1A1A\"/>", "pal": "#E85D00", "palDark": "#FF8A33", "dark": "#1A1A1A", "hero": "#FFF0E5", "sw": [["#FF6B00", "#fff"], ["#FFFFFF", "#E85D00"], ["#1A1A1A", "#fff"], ["#FF8A33", "#1A1A1A"]]}, {"tag": "Option 14", "name": "Hot pink", "why": "Black with a hot pink dial. Fashion-bright and youthful; made for Instagram.", "svg": "<rect width=\"512\" height=\"512\" rx=\"120\" fill=\"#0A0A0A\"/><path d=\"M134.38 403.62 A172.0 172.0 0 0 1 90.76 234.26 L133.03 246.47 A128.0 128.0 0 0 0 165.49 372.51 Z\" fill=\"#FF2D95\"/><path d=\"M99.51 210.62 A172.0 172.0 0 0 1 242.91 110.50 L246.26 154.37 A128.0 128.0 0 0 0 139.54 228.88 Z\" fill=\"#FF2D95\"/><path d=\"M268.11 110.43 A172.0 172.0 0 0 1 412.08 209.73 L372.15 228.22 A128.0 128.0 0 0 0 265.01 154.32 Z\" fill=\"#FF2D95\"/><path d=\"M420.97 233.31 A172.0 172.0 0 0 1 378.32 402.92 L347.03 371.99 A128.0 128.0 0 0 0 378.76 245.77 Z\" fill=\"#FF2D95\"/><path d=\"M256 282 L352 232\" t></defs><rect width=\"512\" height=\"512\" rx=\"120\" fill=\"url(#g1)\"/><path d=\"M134.38 403.62 A172.0 172.0 0 0 1 90.76 234.26 L133.03 246.47 A128.0 128.0 0 0 0 165.49 372.51 Z\" fill=\"#FFFFFF\"/><path d=\"M99.51 210.62 A172.0 172.0 0 0 1 242.91 110.50 L246.26 154.37 A128.0 128.0 0 0 0 139.54 228.88 Z\" fill=\"#FFFFFF\"/><path d=\"M268.11 110.43 A172.0 172.0 0 0 1 412.08 209.73 L372.15 228.22 A128.0 128.0 0 0 0 265.01 154.32 Z\" fill=\"#FFFFFF\"/><path d=\"M420.97 233.31 A172.0 172.0 0 0 1 378.32 402.92 L347.03 371.99 A128.0 128.0 0 0 0 378.76 245.77 Z\" fill=\"#FFFFFF\"/><path d=\"M256 282 L352 232\" stroke=\"#0B1B3F\" stroke-width=\"28\" stroke-linecap=\"round\"/><circle cx=\"256\" cy=\"282\" r=\"30\" fill=\"#0B1B3F\"/>", "pal": "#2563EB", "palDark": "#22D3EE", "dark": "#0B1B3F", "hero": "#E5F3FF", "sw": [["#2563EB", "#fff"], ["#06B6D4", "#0B1B3F"], ["#0B1B3F", "#fff"], ["#FFFFFF", "#2563EB"]]}, {"tag": "Option 19", "name": "Sunrise gradient", "why": "An orange-to-pink gradient tile with a white dial. Warm, bold and full of energy.", "svg": "<defs><linearGradient id=\"g1\" x1=\"0\" y1=\"0\" x2=\"1\" y2=\"1\"><stop offset=\"0\" stop-color=\"#FF9A18\"/><stop offset=\"1\" stop-color=\"#FF2E7E\"/></linearGradient></defs><rect width=\"512\" height=\"512\" rx=\"120\" fill=\"url(#g1)\"/><path d=\"M134.38 403.62 A172.0 172.0 0 0 1 90.76 234.26 L133.03 246.47 A128.0 128.0 0 0 0 165.49 372.51 Z\" fill=\"#FFFFFF\"/><path d=\"M99.51 210.62 A172.0 172.0 0 0 1 242.91 110.50 L246.26 154.37 A128.0 128.0 0 0 0 139.54 228.88 Z\" fill=\"#FFFFFF\"/><path d=\"M268.11 110.43 A172.0 172.0 0 0 1 412.08 209.73 L372.15 228.22 A128.0 128.0 0 0 0 265.01 154.32 Z\" fill=\"#FFFFFF\"/><path d=\"M420.97 233.31 A172.0 172.0 0 0 1 378.32 402.92 L347.03 371.99 A128.0 128.0 0 0 0 378.76 245.77 Z\" fill=\"#FFFFFF\"/><path d=\"M256 282 L352 232\" stroke=\"#1A1A1A\" stroke-width=\"28\" stroke-linecap=\"round\"/><circle cx=\"256\" cy=\"282\" r=\"30\" fill=\"#1A1A1A\"/>", "pal": "#E8590C", "palDark": "#FF7A59", "dark": "#1A1A1A", "hero": "#FFF0E8", "sw": [["#FF7A18", "#1A1A1A"], ["#FF2E7E", "#fff"], ["#1A1A1A", "#fff"], ["#FFFFFF", "#E8590C"]]}, {"tag": "Option 20", "name": "Rainbow pillars", "why": "Black with four vivid segments: green, blue, yellow and pink. Each pillar has its own bright colour.", "svg": "<rect width=\"512\" height=\"512\" rx=\"120\" fill=\"#0A0A0A\"/><path d=\"M134.38 403.62 A172.0 172.0 0 0 1 90.76 234.26 L133.03 246.47 A128.0 128.0 0 0 0 165.49 372.51 Z\" fill=\"#00E676\"/><path d=\"M99.51 210.62 A172.0 172.0 0 0 1 242.91 110.50 L246.26 154.37 A128.0 128.0 0 0 0 139.54 228.88 Z\" fill=\"#2979FF\"/><path d=\"M268.11 110.43 A172.0 172.0 0 0 1 412.08 209.73 L372.15 228.22 A128.0 128.0 0 0 0 265.01 154.32 Z\" fill=\"#FFD600\"/><path d=\"M420.97 233.31 A172.0 172.0 0 0 1 378.32 402.92 L347.03 371.99 A128.0 128.0 0 0 0 378.76 245.77 Z\" fill=\"#FF2D95\"/><path d=\"M256 282 L352 232\" stroke=\"#FFFFFF\" stroke-width=\"28\" stroke-linecap=\"round\"/><circle cx=\"256\" cy=\"282\" r=\"30\" fill=\"#FFFFFF\"/>", "pal": "#2979FF", "palDark": "#00E676", "dark": "#0A0A0A", "hero": "#EEF2F7", "sw": [["#00E676", "#0A0A0A"], ["#2979FF", "#fff"], ["#FFD600", "#0A0A0A"], ["#FF2D95", "#fff"]]}];
let k=0;
const icon=(s,size)=>{k++;const t=s.replace(/id="(g\d)"/g,`id="$1_${k}"`).replace(/url\(#(g\d)\)/g,`url(#$1_${k})`);return `<svg viewBox="0 0 512 512"${size?` width="${size}" height="${size}"`:''}>${t}</svg>`};
const pal=c=>c.startsWith('linear')?`background:${c};-webkit-background-clip:text;background-clip:text;color:transparent`:`color:${c}`;
const word=(d,dark)=>`<span style="font-family:'Plus Jakarta Sans',sans-serif;font-weight:700;letter-spacing:-.03em;color:${dark?'#fff':'#0B0B0F'}">Motor<span style="${pal(dark?d.palDark:d.pal)}">Pal</span></span>`;
document.getElementById('cols').innerHTML=ideas.map(d=>`
<div class="col">
 <div class="hero" style="background:${d.hero}">${icon(d.svg)}</div>
 <div class="lock">${icon(d.svg)}${word(d,false)}</div>

</div>`).join('');
</script></body></html>
