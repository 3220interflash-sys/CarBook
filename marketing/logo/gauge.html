<!doctype html>
<html><head><meta charset="utf-8">
<!-- MotorPal: five modern logo directions, each with its own colours and typeface. make-modern.js renders this. -->
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@700;800&family=Space+Grotesk:wght@700&family=Outfit:wght@700;800&family=Manrope:wght@800&family=Unbounded:wght@700&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{width:2740px;font-family:"Plus Jakarta Sans",system-ui,sans-serif;-webkit-font-smoothing:antialiased;background:#F4F4F6;color:#0B0B0F;padding:80px 90px 90px}
h1{font-size:64px;font-weight:800;letter-spacing:-.03em}
.lead{margin-top:12px;font-size:28px;color:#5B5F6A;font-weight:500}
.cols{margin-top:56px;display:grid;grid-template-columns:repeat(4,1fr);gap:32px}
.col{background:#fff;border-radius:40px;overflow:hidden;box-shadow:0 1px 2px rgba(0,0,0,.04),0 18px 36px -14px rgba(0,0,0,.18);display:flex;flex-direction:column}
.hero{display:grid;place-items:center;padding:56px 0}
.hero svg{width:260px;height:260px;filter:drop-shadow(0 24px 36px rgba(0,0,0,.22))}
.lock{display:flex;align-items:center;justify-content:center;gap:16px;padding:30px 0}
.lock svg{width:64px;height:64px;flex:none}
.lock span{font-size:50px;line-height:1}
.sizes{display:flex;align-items:center;justify-content:center;gap:20px;padding:6px 0 28px}
.sw{display:flex;gap:10px;padding:0 32px}
.sw i{flex:1;height:54px;border-radius:14px;display:flex;align-items:flex-end;padding:0 0 8px 10px;font-style:normal;font-size:15px;font-weight:700}
.cap{padding:24px 32px 34px}
.cap small{font-size:20px;font-weight:700;color:#8A8F99}
.cap b{display:block;margin-top:4px;font-size:32px;font-weight:800;letter-spacing:-.02em}
.cap p{margin-top:10px;font-size:23px;line-height:1.42;color:#474B55;font-weight:500}
</style></head>
<body>
<h1>MotorPal Gauge: putting the brand’s values into the logo</h1>
<p class="lead">Same navy, lime and Space Grotesk. Each version adds one small idea that says what MotorPal promises.</p>
<div class="cols" id="cols"></div>
<script>
const ideas=[{"hero": "#E9EEF6", "dark": "#0F172A", "pal": "#65A30D", "palDark": "#A3E635", "sw": [["#0F172A", "#fff"], ["#334155", "#fff"], ["#A3E635", "#0F172A"], ["#E9EEF6", "#0F172A"]], "tag": "Value: peace of mind", "name": "Always in the green", "svg": "<rect width=\"512\" height=\"512\" rx=\"120\" fill=\"#0F172A\"/><circle cx=\"256\" cy=\"282\" r=\"150\" fill=\"none\" stroke=\"#334155\" stroke-width=\"44\" stroke-linecap=\"round\" stroke-dasharray=\"707 942\" stroke-dashoffset=\"0\" transform=\"rotate(135 256 282)\"/><circle cx=\"256\" cy=\"282\" r=\"150\" fill=\"none\" stroke=\"#A3E635\" stroke-width=\"44\" stroke-linecap=\"round\" stroke-dasharray=\"236 942\" stroke-dashoffset=\"-471\" transform=\"rotate(135 256 282)\"/><path d=\"M256 282 L360 264\" stroke=\"#FFFFFF\" stroke-width=\"28\" stroke-linecap=\"round\"/><circle cx=\"256\" cy=\"282\" r=\"30\" fill=\"#FFFFFF\"/>", "why": "The dial is grey until the last stretch, which is green, and the needle sits in it. The promise: with MotorPal, your vehicle is always in the green."}, {"hero": "#E9EEF6", "dark": "#0F172A", "pal": "#65A30D", "palDark": "#A3E635", "sw": [["#0F172A", "#fff"], ["#334155", "#fff"], ["#A3E635", "#0F172A"], ["#E9EEF6", "#0F172A"]], "tag": "Value: done right", "name": "The tick gauge", "svg": "<rect width=\"512\" height=\"512\" rx=\"120\" fill=\"#0F172A\"/><circle cx=\"256\" cy=\"282\" r=\"150\" fill=\"none\" stroke=\"#334155\" stroke-width=\"44\" stroke-linecap=\"round\" stroke-dasharray=\"707 942\" stroke-dashoffset=\"0\" transform=\"rotate(135 256 282)\"/><circle cx=\"256\" cy=\"282\" r=\"150\" fill=\"none\" stroke=\"#A3E635\" stroke-width=\"44\" stroke-linecap=\"round\" stroke-dasharray=\"707 942\" stroke-dashoffset=\"0\" transform=\"rotate(135 256 282)\"/><path d=\"M196 284 L240 328 L334 226\" fill=\"none\" stroke=\"#FFFFFF\" stroke-width=\"34\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/>", "why": "The needle becomes a tick inside a full green dial. The promise: everything due has been done. Simple, positive, easy to remember."}, {"hero": "#E9EEF6", "dark": "#0F172A", "pal": "#65A30D", "palDark": "#A3E635", "sw": [["#0F172A", "#fff"], ["#334155", "#fff"], ["#A3E635", "#0F172A"], ["#E9EEF6", "#0F172A"]], "tag": "Value: all in one place", "name": "Four pillars", "svg": "<rect width=\"512\" height=\"512\" rx=\"120\" fill=\"#0F172A\"/><circle cx=\"256\" cy=\"282\" r=\"150\" fill=\"none\" stroke=\"#A3E635\" stroke-width=\"44\" stroke-linecap=\"butt\" stroke-dasharray=\"160 22 160 22 160 22 160 400\" stroke-dashoffset=\"0\" transform=\"rotate(135 256 282)\"/><path d=\"M256 282 L352 232\" stroke=\"#FFFFFF\" stroke-width=\"28\" stroke-linecap=\"round\"/><circle cx=\"256\" cy=\"282\" r=\"30\" fill=\"#FFFFFF\"/>", "why": "The dial is four segments: reminders, service records, fuel and costs, warranties. All lit means everything is covered. Each segment can be a colour inside the app."}, {"hero": "#E9EEF6", "dark": "#0F172A", "pal": "#65A30D", "palDark": "#A3E635", "sw": [["#0F172A", "#fff"], ["#334155", "#fff"], ["#A3E635", "#0F172A"], ["#E9EEF6", "#0F172A"]], "tag": "Value: a pal you can ask", "name": "The talking gauge", "svg": "<rect width=\"512\" height=\"512\" rx=\"120\" fill=\"#0F172A\"/><path d=\"M150 388 L112 446 L206 420 Z\" fill=\"#A3E635\" stroke=\"#A3E635\" stroke-width=\"20\" stroke-linejoin=\"round\"/><circle cx=\"256\" cy=\"282\" r=\"150\" fill=\"none\" stroke=\"#334155\" stroke-width=\"44\" stroke-linecap=\"round\" stroke-dasharray=\"707 942\" stroke-dashoffset=\"0\" transform=\"rotate(135 256 282)\"/><circle cx=\"256\" cy=\"282\" r=\"150\" fill=\"none\" stroke=\"#A3E635\" stroke-width=\"44\" stroke-linecap=\"round\" stroke-dasharray=\"500 942\" stroke-dashoffset=\"0\" transform=\"rotate(135 256 282)\"/><path d=\"M256 282 L352 232\" stroke=\"#FFFFFF\" stroke-width=\"28\" stroke-linecap=\"round\"/><circle cx=\"256\" cy=\"282\" r=\"30\" fill=\"#FFFFFF\"/>", "why": "A small speech-bubble tail on the dial. The gauge is talking to you: a friend that tells you where you stand, in plain words."}];
let k=0;
const icon=(s,size)=>{k++;const t=s.replace(/id="(g\d)"/g,`id="$1_${k}"`).replace(/url\(#(g\d)\)/g,`url(#$1_${k})`);return `<svg viewBox="0 0 512 512"${size?` width="${size}" height="${size}"`:''}>${t}</svg>`};
const pal=c=>c.startsWith('linear')?`background:${c};-webkit-background-clip:text;background-clip:text;color:transparent`:`color:${c}`;
const word=(d,dark)=>`<span style="font-family:'Space Grotesk',sans-serif;font-weight:700;letter-spacing:-.03em;color:${dark?'#fff':'#0B0B0F'}">Motor<span style="${pal(dark?d.palDark:d.pal)}">Pal</span></span>`;
document.getElementById('cols').innerHTML=ideas.map(d=>`
<div class="col">
 <div class="hero" style="background:${d.hero}">${icon(d.svg)}</div>
 <div class="lock">${icon(d.svg)}${word(d,false)}</div>
 <div class="lock" style="background:${d.dark}">${icon(d.svg)}${word(d,true)}</div>
 <div class="sizes" style="padding-top:28px">${icon(d.svg,96)}${icon(d.svg,60)}${icon(d.svg,36)}</div>
 <div class="sw">${d.sw.map(([c,f])=>`<i style="background:${c};color:${f}">${c}</i>`).join('')}</div>
 <div class="cap"><small>${d.tag}</small><b>${d.name}</b><p>${d.why}</p></div>
</div>`).join('');
</script></body></html>
