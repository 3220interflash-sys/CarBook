<!doctype html>
<html><head><meta charset="utf-8">
<!-- MotorPal: five modern logo directions, each with its own colours and typeface. make-modern.js renders this. -->
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@700;800&family=Space+Grotesk:wght@700&family=Outfit:wght@700;800&family=Manrope:wght@800&family=Unbounded:wght@700&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{width:2740px;font-family:"Plus Jakarta Sans",system-ui,sans-serif;-webkit-font-smoothing:antialiased;background:#F4F4F6;color:#0B0B0F;padding:80px 90px 90px}
h1{font-size:64px;font-weight:800;letter-spacing:-.03em}
.lead{margin-top:12px;font-size:28px;color:#5B5F6A;font-weight:500}
.cols{margin-top:56px;display:grid;grid-template-columns:repeat(4,1fr);gap:32px}
.col{background:#fff;border-radius:40px;overflow:hidden;box-shadow:0 1px 2px rgba(0,0,0,.04),0 18px 36px -14px rgba(0,0,0,.18);display:flex;flex-direction:column}
.hero{display:grid;place-items:center;padding:56px 0}
.hero svg{width:260px;height:260px;filter:drop-shadow(0 24px 36px rgba(0,0,0,.22))}
.lock{display:flex;align-items:center;justify-content:center;gap:16px;padding:30px 0}
.lock svg{width:64px;height:64px;flex:none}
.lock span{font-size:50px;line-height:1}
.sizes{display:flex;align-items:center;justify-content:center;gap:20px;padding:6px 0 28px}
.sw{display:flex;gap:10px;padding:0 32px}
.sw i{flex:1;height:54px;border-radius:14px;display:flex;align-items:flex-end;padding:0 0 8px 10px;font-style:normal;font-size:15px;font-weight:700}
.cap{padding:24px 32px 34px}
.cap small{font-size:20px;font-weight:700;color:#8A8F99}
.cap b{display:block;margin-top:4px;font-size:32px;font-weight:800;letter-spacing:-.02em}
.cap p{margin-top:10px;font-size:23px;line-height:1.42;color:#474B55;font-weight:500}
</style></head>
<body>
<h1>MotorPal: Ask a pal, with an M</h1>
<p class="lead">The M sits inside the steering wheel: its legs are the lower spokes and its middle meets the hub. Four colour options. Font: Outfit.</p>
<div class="cols" id="cols"></div>
<script>
const ideas=[{"tag": "Colour 1", "name": "Teal and peach", "why": "The original colours. Warm and approachable, very \u201cpal\u201d.", "svg": "<defs><linearGradient id=\"g1\" x1=\"0\" y1=\"0\" x2=\"0\" y2=\"1\"><stop offset=\"0\" stop-color=\"#14B8A6\"/><stop offset=\"1\" stop-color=\"#0D9488\"/></linearGradient></defs><rect width=\"512\" height=\"512\" rx=\"120\" fill=\"url(#g1)\"/><path d=\"M136 104 H376 A60 60 0 0 1 436 164 V320 A60 60 0 0 1 376 380 H236 L166 434 V380 H136 A60 60 0 0 1 76 320 V164 A60 60 0 0 1 136 104 Z\" fill=\"#FFFFFF\"/><circle cx=\"256\" cy=\"240\" r=\"100\" fill=\"none\" stroke=\"#0D9488\" stroke-width=\"24\"/><path d=\"M204 326 V196 L256 260 L308 196 V326\" fill=\"none\" stroke=\"#0D9488\" stroke-width=\"26\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><circle cx=\"256\" cy=\"262\" r=\"22\" fill=\"#FDBA74\"/>", "hero": "#E3F7F5", "dark": "#134E4A", "pal": "#0D9488", "palDark": "#FDBA74", "sw": [["#0D9488", "#fff"], ["#134E4A", "#fff"], ["#FDBA74", "#134E4A"], ["#E3F7F5", "#0D9488"]]}, {"tag": "Colour 2", "name": "Indigo and coral", "why": "Deep indigo with a coral hub. More modern and premium, still friendly.", "svg": "<defs><linearGradient id=\"g1\" x1=\"0\" y1=\"0\" x2=\"0\" y2=\"1\"><stop offset=\"0\" stop-color=\"#6366F1\"/><stop offset=\"1\" stop-color=\"#4338CA\"/></linearGradient></defs><rect width=\"512\" height=\"512\" rx=\"120\" fill=\"url(#g1)\"/><path d=\"M136 104 H376 A60 60 0 0 1 436 164 V320 A60 60 0 0 1 376 380 H236 L166 434 V380 H136 A60 60 0 0 1 76 320 V164 A60 60 0 0 1 136 104 Z\" fill=\"#FFFFFF\"/><circle cx=\"256\" cy=\"240\" r=\"100\" fill=\"none\" stroke=\"#4338CA\" stroke-width=\"24\"/><path d=\"M204 326 V196 L256 260 L308 196 V326\" fill=\"none\" stroke=\"#4338CA\" stroke-width=\"26\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><circle cx=\"256\" cy=\"262\" r=\"22\" fill=\"#FF6B6B\"/>", "hero": "#EEF0FF", "dark": "#1E1B4B", "pal": "#4F46E5", "palDark": "#FF8A8A", "sw": [["#4338CA", "#fff"], ["#1E1B4B", "#fff"], ["#FF6B6B", "#fff"], ["#EEF0FF", "#4338CA"]]}, {"tag": "Colour 3", "name": "Sunset bubble", "why": "The bubble itself carries the orange-to-pink gradient on black, matching the pulse. Bold and youthful.", "svg": "<defs><linearGradient id=\"g1\" x1=\"0\" y1=\"0\" x2=\"0\" y2=\"1\"><stop offset=\"0\" stop-color=\"#16161C\"/><stop offset=\"1\" stop-color=\"#0B0B0F\"/></linearGradient><linearGradient id=\"g2\" x1=\"0\" y1=\"0\" x2=\"1\" y2=\"1\"><stop offset=\"0\" stop-color=\"#FF7A18\"/><stop offset=\"1\" stop-color=\"#FF2E7E\"/></linearGradient></defs><rect width=\"512\" height=\"512\" rx=\"120\" fill=\"url(#g1)\"/><path d=\"M136 104 H376 A60 60 0 0 1 436 164 V320 A60 60 0 0 1 376 380 H236 L166 434 V380 H136 A60 60 0 0 1 76 320 V164 A60 60 0 0 1 136 104 Z\" fill=\"url(#g2)\"/><circle cx=\"256\" cy=\"240\" r=\"100\" fill=\"none\" stroke=\"#0B0B0F\" stroke-width=\"24\"/><path d=\"M204 326 V196 L256 260 L308 196 V326\" fill=\"none\" stroke=\"#0B0B0F\" stroke-width=\"26\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><circle cx=\"256\" cy=\"262\" r=\"22\" fill=\"#FFFFFF\"/>", "hero": "#FFEFF4", "dark": "#0B0B0F", "pal": "linear-gradient(90deg,#FF7A18,#FF2E7E)", "palDark": "linear-gradient(90deg,#FF7A18,#FF2E7E)", "sw": [["#0B0B0F", "#fff"], ["#FF7A18", "#0B0B0F"], ["#FF2E7E", "#fff"], ["#FFEFF4", "#BE185D"]]}, {"tag": "Colour 4", "name": "Sky and sun", "why": "Bright sky blue with a sunny yellow hub. Cheerful and clear, feels safe and easy.", "svg": "<defs><linearGradient id=\"g1\" x1=\"0\" y1=\"0\" x2=\"0\" y2=\"1\"><stop offset=\"0\" stop-color=\"#38BDF8\"/><stop offset=\"1\" stop-color=\"#0284C7\"/></linearGradient></defs><rect width=\"512\" height=\"512\" rx=\"120\" fill=\"url(#g1)\"/><path d=\"M136 104 H376 A60 60 0 0 1 436 164 V320 A60 60 0 0 1 376 380 H236 L166 434 V380 H136 A60 60 0 0 1 76 320 V164 A60 60 0 0 1 136 104 Z\" fill=\"#FFFFFF\"/><circle cx=\"256\" cy=\"240\" r=\"100\" fill=\"none\" stroke=\"#0369A1\" stroke-width=\"24\"/><path d=\"M204 326 V196 L256 260 L308 196 V326\" fill=\"none\" stroke=\"#0369A1\" stroke-width=\"26\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><circle cx=\"256\" cy=\"262\" r=\"22\" fill=\"#FACC15\"/>", "hero": "#E0F2FE", "dark": "#0C2D48", "pal": "#0284C7", "palDark": "#FACC15", "sw": [["#0284C7", "#fff"], ["#0C2D48", "#fff"], ["#FACC15", "#0C2D48"], ["#E0F2FE", "#0369A1"]]}];
let k=0;
const icon=(s,size)=>{k++;const t=s.replace(/id="(g\d)"/g,`id="$1_${k}"`).replace(/url\(#(g\d)\)/g,`url(#$1_${k})`);return `<svg viewBox="0 0 512 512"${size?` width="${size}" height="${size}"`:''}>${t}</svg>`};
const pal=c=>c.startsWith('linear')?`background:${c};-webkit-background-clip:text;background-clip:text;color:transparent`:`color:${c}`;
const word=(d,dark)=>`<span style="font-family:'Outfit',sans-serif;font-weight:800;letter-spacing:-.03em;color:${dark?'#fff':'#0B0B0F'}">Motor<span style="${pal(dark?d.palDark:d.pal)}">Pal</span></span>`;
document.getElementById('cols').innerHTML=ideas.map(d=>`
<div class="col">
 <div class="hero" style="background:${d.hero}">${icon(d.svg)}</div>
 <div class="lock">${icon(d.svg)}${word(d,false)}</div>
 <div class="lock" style="background:${d.dark}">${icon(d.svg)}${word(d,true)}</div>
 <div class="sizes" style="padding-top:28px">${icon(d.svg,96)}${icon(d.svg,60)}${icon(d.svg,36)}</div>
 <div class="sw">${d.sw.map(([c,f])=>`<i style="background:${c};color:${f}">${c}</i>`).join('')}</div>
 <div class="cap"><small>${d.tag}</small><b>${d.name}</b><p>${d.why}</p></div>
</div>`).join('');
</script></body></html>
