<!doctype html>
<html><head><meta charset="utf-8">
<!-- MotorPal: five modern logo directions, each with its own colours and typeface. make-modern.js renders this. -->
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@700;800&family=Space+Grotesk:wght@700&family=Outfit:wght@700;800&family=Manrope:wght@800&family=Unbounded:wght@700&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{width:2100px;font-family:"Plus Jakarta Sans",system-ui,sans-serif;-webkit-font-smoothing:antialiased;background:#F4F4F6;color:#0B0B0F;padding:80px 90px 90px}
h1{font-size:64px;font-weight:800;letter-spacing:-.03em}
.lead{margin-top:12px;font-size:28px;color:#5B5F6A;font-weight:500}
.cols{margin-top:56px;display:grid;grid-template-columns:repeat(3,1fr);gap:32px}
.col{background:#fff;border-radius:40px;overflow:hidden;box-shadow:0 1px 2px rgba(0,0,0,.04),0 18px 36px -14px rgba(0,0,0,.18);display:flex;flex-direction:column}
.hero{display:grid;place-items:center;padding:56px 0}
.hero svg{width:260px;height:260px;filter:drop-shadow(0 24px 36px rgba(0,0,0,.22))}
.lock{display:flex;align-items:center;justify-content:center;gap:16px;padding:30px 0}
.lock svg{width:64px;height:64px;flex:none}
.lock span{font-size:50px;line-height:1}
.sizes{display:flex;align-items:center;justify-content:center;gap:20px;padding:6px 0 28px}
.sw{display:flex;gap:10px;padding:0 32px}
.sw i{flex:1;height:54px;border-radius:14px;display:flex;align-items:flex-end;padding:0 0 8px 10px;font-style:normal;font-size:15px;font-weight:700}
.cap{padding:24px 32px 34px}
.cap small{font-size:20px;font-weight:700;color:#8A8F99}
.cap b{display:block;margin-top:4px;font-size:32px;font-weight:800;letter-spacing:-.02em}
.cap p{margin-top:10px;font-size:23px;line-height:1.42;color:#474B55;font-weight:500}
</style></head>
<body>
<h1>MotorPal: Neon mint, a bit darker</h1>
<p class="lead">Three darker shades of the mint dial. Font: Plus Jakarta Sans.</p>
<div class="cols" id="cols"></div>
<script>
const ideas=[{"tag": "Option 10a", "name": "Mint, a touch darker", "why": "Black tile with a #00DB8F dial and a white needle.", "svg": "<rect width=\"512\" height=\"512\" rx=\"120\" fill=\"#050505\"/><path d=\"M134.38 403.62 A172.0 172.0 0 0 1 90.76 234.26 L133.03 246.47 A128.0 128.0 0 0 0 165.49 372.51 Z\" fill=\"#00DB8F\"/><path d=\"M99.51 210.62 A172.0 172.0 0 0 1 242.91 110.50 L246.26 154.37 A128.0 128.0 0 0 0 139.54 228.88 Z\" fill=\"#00DB8F\"/><path d=\"M268.11 110.43 A172.0 172.0 0 0 1 412.08 209.73 L372.15 228.22 A128.0 128.0 0 0 0 265.01 154.32 Z\" fill=\"#00DB8F\"/><path d=\"M420.97 233.31 A172.0 172.0 0 0 1 378.32 402.92 L347.03 371.99 A128.0 128.0 0 0 0 378.76 245.77 Z\" fill=\"#00DB8F\"/><path d=\"M256 282 L352 232\" stroke=\"#FFFFFF\" stroke-width=\"28\" stroke-linecap=\"round\"/><circle cx=\"256\" cy=\"282\" r=\"30\" fill=\"#FFFFFF\"/>", "pal": "#00905E", "palDark": "#00DB8F", "dark": "#050505", "hero": "#E6FFF5", "sw": [["#050505", "#fff"], ["#00DB8F", "#050505"], ["#00905E", "#fff"], ["#FFFFFF", "#050505"]]}, {"tag": "Option 10b", "name": "Mint, darker", "why": "Black tile with a #00C47F dial and a white needle.", "svg": "<rect width=\"512\" height=\"512\" rx=\"120\" fill=\"#050505\"/><path d=\"M134.38 403.62 A172.0 172.0 0 0 1 90.76 234.26 L133.03 246.47 A128.0 128.0 0 0 0 165.49 372.51 Z\" fill=\"#00C47F\"/><path d=\"M99.51 210.62 A172.0 172.0 0 0 1 242.91 110.50 L246.26 154.37 A128.0 128.0 0 0 0 139.54 228.88 Z\" fill=\"#00C47F\"/><path d=\"M268.11 110.43 A172.0 172.0 0 0 1 412.08 209.73 L372.15 228.22 A128.0 128.0 0 0 0 265.01 154.32 Z\" fill=\"#00C47F\"/><path d=\"M420.97 233.31 A172.0 172.0 0 0 1 378.32 402.92 L347.03 371.99 A128.0 128.0 0 0 0 378.76 245.77 Z\" fill=\"#00C47F\"/><path d=\"M256 282 L352 232\" stroke=\"#FFFFFF\" stroke-width=\"28\" stroke-linecap=\"round\"/><circle cx=\"256\" cy=\"282\" r=\"30\" fill=\"#FFFFFF\"/>", "pal": "#007F53", "palDark": "#00C47F", "dark": "#050505", "hero": "#E6FFF5", "sw": [["#050505", "#fff"], ["#00C47F", "#050505"], ["#007F53", "#fff"], ["#FFFFFF", "#050505"]]}, {"tag": "Option 10c", "name": "Deep mint", "why": "Black tile with a #00A86B dial and a white needle.", "svg": "<rect width=\"512\" height=\"512\" rx=\"120\" fill=\"#050505\"/><path d=\"M134.38 403.62 A172.0 172.0 0 0 1 90.76 234.26 L133.03 246.47 A128.0 128.0 0 0 0 165.49 372.51 Z\" fill=\"#00A86B\"/><path d=\"M99.51 210.62 A172.0 172.0 0 0 1 242.91 110.50 L246.26 154.37 A128.0 128.0 0 0 0 139.54 228.88 Z\" fill=\"#00A86B\"/><path d=\"M268.11 110.43 A172.0 172.0 0 0 1 412.08 209.73 L372.15 228.22 A128.0 128.0 0 0 0 265.01 154.32 Z\" fill=\"#00A86B\"/><path d=\"M420.97 233.31 A172.0 172.0 0 0 1 378.32 402.92 L347.03 371.99 A128.0 128.0 0 0 0 378.76 245.77 Z\" fill=\"#00A86B\"/><path d=\"M256 282 L352 232\" stroke=\"#FFFFFF\" stroke-width=\"28\" stroke-linecap=\"round\"/><circle cx=\"256\" cy=\"282\" r=\"30\" fill=\"#FFFFFF\"/>", "pal": "#006E47", "palDark": "#00A86B", "dark": "#050505", "hero": "#E6FFF5", "sw": [["#050505", "#fff"], ["#00A86B", "#050505"], ["#006E47", "#fff"], ["#FFFFFF", "#050505"]]}];
let k=0;
const icon=(s,size)=>{k++;const t=s.replace(/id="(g\d)"/g,`id="$1_${k}"`).replace(/url\(#(g\d)\)/g,`url(#$1_${k})`);return `<svg viewBox="0 0 512 512"${size?` width="${size}" height="${size}"`:''}>${t}</svg>`};
const pal=c=>c.startsWith('linear')?`background:${c};-webkit-background-clip:text;background-clip:text;color:transparent`:`color:${c}`;
const word=(d,dark)=>`<span style="font-family:'Plus Jakarta Sans',sans-serif;font-weight:700;letter-spacing:-.03em;color:${dark?'#fff':'#0B0B0F'}">Motor<span style="${pal(dark?d.palDark:d.pal)}">Pal</span></span>`;
document.getElementById('cols').innerHTML=ideas.map(d=>`
<div class="col">
 <div class="hero" style="background:${d.hero}">${icon(d.svg)}</div>
 <div class="lock">${icon(d.svg)}${word(d,false)}</div>
 <div class="lock" style="background:${d.dark}">${icon(d.svg)}${word(d,true)}</div>
 <div class="sizes" style="padding-top:28px">${icon(d.svg,96)}${icon(d.svg,60)}${icon(d.svg,36)}</div>
 <div class="sw">${d.sw.map(([c,f])=>`<i style="background:${c};color:${f}">${c}</i>`).join('')}</div>
 <div class="cap"><small>${d.tag}</small><b>${d.name}</b><p>${d.why}</p></div>
</div>`).join('');
</script></body></html>
