<!doctype html>
<html><head><meta charset="utf-8">
<!-- MotorPal: five modern logo directions, each with its own colours and typeface. make-modern.js renders this. -->
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@700;800&family=Space+Grotesk:wght@700&family=Outfit:wght@700;800&family=Manrope:wght@800&family=Unbounded:wght@700&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{width:2740px;font-family:"Plus Jakarta Sans",system-ui,sans-serif;-webkit-font-smoothing:antialiased;background:#F4F4F6;color:#0B0B0F;padding:80px 90px 90px}
h1{font-size:64px;font-weight:800;letter-spacing:-.03em}
.lead{margin-top:12px;font-size:28px;color:#5B5F6A;font-weight:500}
.cols{margin-top:56px;display:grid;grid-template-columns:repeat(4,1fr);gap:32px}
.col{background:#fff;border-radius:40px;overflow:hidden;box-shadow:0 1px 2px rgba(0,0,0,.04),0 18px 36px -14px rgba(0,0,0,.18);display:flex;flex-direction:column}
.hero{display:grid;place-items:center;padding:56px 0}
.hero svg{width:260px;height:260px;filter:drop-shadow(0 24px 36px rgba(0,0,0,.22))}
.lock{display:flex;align-items:center;justify-content:center;gap:16px;padding:30px 0}
.lock svg{width:64px;height:64px;flex:none}
.lock span{font-size:50px;line-height:1}
.sizes{display:flex;align-items:center;justify-content:center;gap:20px;padding:6px 0 28px}
.sw{display:flex;gap:10px;padding:0 32px}
.sw i{flex:1;height:54px;border-radius:14px;display:flex;align-items:flex-end;padding:0 0 8px 10px;font-style:normal;font-size:15px;font-weight:700}
.cap{padding:24px 32px 34px}
.cap small{font-size:20px;font-weight:700;color:#8A8F99}
.cap b{display:block;margin-top:4px;font-size:32px;font-weight:800;letter-spacing:-.02em}
.cap p{margin-top:10px;font-size:23px;line-height:1.42;color:#474B55;font-weight:500}
</style></head>
<body>
<h1>MotorPal: colour options</h1>
<p class="lead">The “Four pillars” logo in eight colour combinations. Same shape; only the colours change. Font: Plus Jakarta Sans.</p>
<div class="cols" id="cols"></div>
<script>
const ideas=[{"tag": "Option 1", "name": "Navy and lime", "why": "The chosen colours. Fresh, modern and clearly \u201call in the green\u201d.", "svg": "<rect x=\"4\" y=\"4\" width=\"504\" height=\"504\" rx=\"116\" fill=\"#0F172A\"/><path d=\"M134.38 403.62 A172.0 172.0 0 0 1 90.76 234.26 L133.03 246.47 A128.0 128.0 0 0 0 165.49 372.51 Z\" fill=\"#A3E635\"/><path d=\"M99.51 210.62 A172.0 172.0 0 0 1 242.91 110.50 L246.26 154.37 A128.0 128.0 0 0 0 139.54 228.88 Z\" fill=\"#A3E635\"/><path d=\"M268.11 110.43 A172.0 172.0 0 0 1 412.08 209.73 L372.15 228.22 A128.0 128.0 0 0 0 265.01 154.32 Z\" fill=\"#A3E635\"/><path d=\"M420.97 233.31 A172.0 172.0 0 0 1 378.32 402.92 L347.03 371.99 A128.0 128.0 0 0 0 378.76 245.77 Z\" fill=\"#A3E635\"/><path d=\"M256 282 L352 232\" stroke=\"#FFFFFF\" stroke-width=\"28\" stroke-linecap=\"round\"/><circle cx=\"256\" cy=\"282\" r=\"30\" fill=\"#FFFFFF\"/>", "pal": "#65A30D", "palDark": "#A3E635", "dark": "#0F172A", "hero": "#E9EEF6", "sw": [["#0F172A", "#fff"], ["#A3E635", "#0F172A"], ["#65A30D", "#fff"], ["#FFFFFF", "#0F172A"]]}, {"tag": "Option 2", "name": "Four colours", "why": "Each segment gets its own colour: reminders, service, fuel and costs, warranties. The same colours can label those areas in the app.", "svg": "<rect x=\"4\" y=\"4\" width=\"504\" height=\"504\" rx=\"116\" fill=\"#0F172A\"/><path d=\"M134.38 403.62 A172.0 172.0 0 0 1 90.76 234.26 L133.03 246.47 A128.0 128.0 0 0 0 165.49 372.51 Z\" fill=\"#A3E635\"/><path d=\"M99.51 210.62 A172.0 172.0 0 0 1 242.91 110.50 L246.26 154.37 A128.0 128.0 0 0 0 139.54 228.88 Z\" fill=\"#22D3EE\"/><path d=\"M268.11 110.43 A172.0 172.0 0 0 1 412.08 209.73 L372.15 228.22 A128.0 128.0 0 0 0 265.01 154.32 Z\" fill=\"#FBBF24\"/><path d=\"M420.97 233.31 A172.0 172.0 0 0 1 378.32 402.92 L347.03 371.99 A128.0 128.0 0 0 0 378.76 245.77 Z\" fill=\"#A78BFA\"/><path d=\"M256 282 L352 232\" stroke=\"#FFFFFF\" stroke-width=\"28\" stroke-linecap=\"round\"/><circle cx=\"256\" cy=\"282\" r=\"30\" fill=\"#FFFFFF\"/>", "pal": "#65A30D", "palDark": "#A3E635", "dark": "#0F172A", "hero": "#E9EEF6", "sw": [["#A3E635", "#0F172A"], ["#22D3EE", "#0F172A"], ["#FBBF24", "#0F172A"], ["#A78BFA", "#0F172A"]]}, {"tag": "Option 3", "name": "Night drive", "why": "Deep navy with electric cyan. Calm, techy and premium, like a banking app.", "svg": "<rect x=\"4\" y=\"4\" width=\"504\" height=\"504\" rx=\"116\" fill=\"#0B1026\"/><path d=\"M134.38 403.62 A172.0 172.0 0 0 1 90.76 234.26 L133.03 246.47 A128.0 128.0 0 0 0 165.49 372.51 Z\" fill=\"#22D3EE\"/><path d=\"M99.51 210.62 A172.0 172.0 0 0 1 242.91 110.50 L246.26 154.37 A128.0 128.0 0 0 0 139.54 228.88 Z\" fill=\"#22D3EE\"/><path d=\"M268.11 110.43 A172.0 172.0 0 0 1 412.08 209.73 L372.15 228.22 A128.0 128.0 0 0 0 265.01 154.32 Z\" fill=\"#22D3EE\"/><path d=\"M420.97 233.31 A172.0 172.0 0 0 1 378.32 402.92 L347.03 371.99 A128.0 128.0 0 0 0 378.76 245.77 Z\" fill=\"#22D3EE\"/><path d=\"M256 282 L352 232\" stroke=\"#FFFFFF\" stroke-width=\"28\" stroke-linecap=\"round\"/><circle cx=\"256\" cy=\"282\" r=\"30\" fill=\"#FFFFFF\"/>", "pal": "#0891B2", "palDark": "#22D3EE", "dark": "#0B1026", "hero": "#E6F4FA", "sw": [["#0B1026", "#fff"], ["#22D3EE", "#0B1026"], ["#0891B2", "#fff"], ["#FFFFFF", "#0B1026"]]}, {"tag": "Option 4", "name": "Sunset", "why": "Black with segments that warm from orange to pink. Bold and youthful; stands out on Instagram.", "svg": "<rect x=\"4\" y=\"4\" width=\"504\" height=\"504\" rx=\"116\" fill=\"#0B0B0F\"/><path d=\"M134.38 403.62 A172.0 172.0 0 0 1 90.76 234.26 L133.03 246.47 A128.0 128.0 0 0 0 165.49 372.51 Z\" fill=\"#FF7A18\"/><path d=\"M99.51 210.62 A172.0 172.0 0 0 1 242.91 110.50 L246.26 154.37 A128.0 128.0 0 0 0 139.54 228.88 Z\" fill=\"#FF5A3D\"/><path d=\"M268.11 110.43 A172.0 172.0 0 0 1 412.08 209.73 L372.15 228.22 A128.0 128.0 0 0 0 265.01 154.32 Z\" fill=\"#FF3E5E\"/><path d=\"M420.97 233.31 A172.0 172.0 0 0 1 378.32 402.92 L347.03 371.99 A128.0 128.0 0 0 0 378.76 245.77 Z\" fill=\"#FF2E7E\"/><path d=\"M256 282 L352 232\" stroke=\"#FFFFFF\" stroke-width=\"28\" stroke-linecap=\"round\"/><circle cx=\"256\" cy=\"282\" r=\"30\" fill=\"#FFFFFF\"/>", "pal": "#E11D63", "palDark": "#FF5A6E", "dark": "#0B0B0F", "hero": "#FFEFF4", "sw": [["#0B0B0F", "#fff"], ["#FF7A18", "#0B0B0F"], ["#FF2E7E", "#fff"], ["#FFEFF4", "#BE185D"]]}, {"tag": "Option 5", "name": "Forest and gold", "why": "Deep green with goldfish yellow, the colours CarBook started with. Warm, trusted and local.", "svg": "<rect x=\"4\" y=\"4\" width=\"504\" height=\"504\" rx=\"116\" fill=\"#0B3D2E\"/><path d=\"M134.38 403.62 A172.0 172.0 0 0 1 90.76 234.26 L133.03 246.47 A128.0 128.0 0 0 0 165.49 372.51 Z\" fill=\"#FFC425\"/><path d=\"M99.51 210.62 A172.0 172.0 0 0 1 242.91 110.50 L246.26 154.37 A128.0 128.0 0 0 0 139.54 228.88 Z\" fill=\"#FFC425\"/><path d=\"M268.11 110.43 A172.0 172.0 0 0 1 412.08 209.73 L372.15 228.22 A128.0 128.0 0 0 0 265.01 154.32 Z\" fill=\"#FFC425\"/><path d=\"M420.97 233.31 A172.0 172.0 0 0 1 378.32 402.92 L347.03 371.99 A128.0 128.0 0 0 0 378.76 245.77 Z\" fill=\"#FFC425\"/><path d=\"M256 282 L352 232\" stroke=\"#FFFFFF\" stroke-width=\"28\" stroke-linecap=\"round\"/><circle cx=\"256\" cy=\"282\" r=\"30\" fill=\"#FFFFFF\"/>", "pal": "#0A7F55", "palDark": "#FFC425", "dark": "#0B3D2E", "hero": "#E8F3EE", "sw": [["#0B3D2E", "#fff"], ["#FFC425", "#0B3D2E"], ["#0A7F55", "#fff"], ["#FFFFFF", "#0B3D2E"]]}, {"tag": "Option 6", "name": "Indigo and coral", "why": "Rich indigo with soft coral. Friendly and a little playful, still classy.", "svg": "<rect x=\"4\" y=\"4\" width=\"504\" height=\"504\" rx=\"116\" fill=\"#312E81\"/><path d=\"M134.38 403.62 A172.0 172.0 0 0 1 90.76 234.26 L133.03 246.47 A128.0 128.0 0 0 0 165.49 372.51 Z\" fill=\"#FF8A80\"/><path d=\"M99.51 210.62 A172.0 172.0 0 0 1 242.91 110.50 L246.26 154.37 A128.0 128.0 0 0 0 139.54 228.88 Z\" fill=\"#FF8A80\"/><path d=\"M268.11 110.43 A172.0 172.0 0 0 1 412.08 209.73 L372.15 228.22 A128.0 128.0 0 0 0 265.01 154.32 Z\" fill=\"#FF8A80\"/><path d=\"M420.97 233.31 A172.0 172.0 0 0 1 378.32 402.92 L347.03 371.99 A128.0 128.0 0 0 0 378.76 245.77 Z\" fill=\"#FF8A80\"/><path d=\"M256 282 L352 232\" stroke=\"#FFFFFF\" stroke-width=\"28\" stroke-linecap=\"round\"/><circle cx=\"256\" cy=\"282\" r=\"30\" fill=\"#FFFFFF\"/>", "pal": "#4F46E5", "palDark": "#FF8A80", "dark": "#1E1B4B", "hero": "#EEF0FF", "sw": [["#312E81", "#fff"], ["#FF8A80", "#312E81"], ["#4F46E5", "#fff"], ["#FFFFFF", "#312E81"]]}, {"tag": "Option 7", "name": "Royal blue and sky", "why": "Strong blue with light sky blue. Feels safe, official and trustworthy, like a bank or insurer.", "svg": "<rect x=\"4\" y=\"4\" width=\"504\" height=\"504\" rx=\"116\" fill=\"#1D4ED8\"/><path d=\"M134.38 403.62 A172.0 172.0 0 0 1 90.76 234.26 L133.03 246.47 A128.0 128.0 0 0 0 165.49 372.51 Z\" fill=\"#BAE6FD\"/><path d=\"M99.51 210.62 A172.0 172.0 0 0 1 242.91 110.50 L246.26 154.37 A128.0 128.0 0 0 0 139.54 228.88 Z\" fill=\"#BAE6FD\"/><path d=\"M268.11 110.43 A172.0 172.0 0 0 1 412.08 209.73 L372.15 228.22 A128.0 128.0 0 0 0 265.01 154.32 Z\" fill=\"#BAE6FD\"/><path d=\"M420.97 233.31 A172.0 172.0 0 0 1 378.32 402.92 L347.03 371.99 A128.0 128.0 0 0 0 378.76 245.77 Z\" fill=\"#BAE6FD\"/><path d=\"M256 282 L352 232\" stroke=\"#FFFFFF\" stroke-width=\"28\" stroke-linecap=\"round\"/><circle cx=\"256\" cy=\"282\" r=\"30\" fill=\"#FFFFFF\"/>", "pal": "#1D4ED8", "palDark": "#7DD3FC", "dark": "#0C1E4A", "hero": "#E0ECFF", "sw": [["#1D4ED8", "#fff"], ["#BAE6FD", "#0C1E4A"], ["#0C1E4A", "#fff"], ["#FFFFFF", "#1D4ED8"]]}, {"tag": "Option 8", "name": "Clean white", "why": "A white icon with green segments and a navy needle. The lightest, cleanest feel; looks good on any phone wallpaper.", "svg": "<rect x=\"4\" y=\"4\" width=\"504\" height=\"504\" rx=\"116\" fill=\"#FFFFFF\" stroke=\"#E2E8F0\" stroke-width=\"8\"/><path d=\"M134.38 403.62 A172.0 172.0 0 0 1 90.76 234.26 L133.03 246.47 A128.0 128.0 0 0 0 165.49 372.51 Z\" fill=\"#16A34A\"/><path d=\"M99.51 210.62 A172.0 172.0 0 0 1 242.91 110.50 L246.26 154.37 A128.0 128.0 0 0 0 139.54 228.88 Z\" fill=\"#16A34A\"/><path d=\"M268.11 110.43 A172.0 172.0 0 0 1 412.08 209.73 L372.15 228.22 A128.0 128.0 0 0 0 265.01 154.32 Z\" fill=\"#16A34A\"/><path d=\"M420.97 233.31 A172.0 172.0 0 0 1 378.32 402.92 L347.03 371.99 A128.0 128.0 0 0 0 378.76 245.77 Z\" fill=\"#16A34A\"/><path d=\"M256 282 L352 232\" stroke=\"#0F172A\" stroke-width=\"28\" stroke-linecap=\"round\"/><circle cx=\"256\" cy=\"282\" r=\"30\" fill=\"#0F172A\"/>", "pal": "#16A34A", "palDark": "#4ADE80", "dark": "#0F172A", "hero": "#EEF1F4", "sw": [["#FFFFFF", "#16A34A"], ["#16A34A", "#fff"], ["#0F172A", "#fff"], ["#4ADE80", "#0F172A"]]}];
let k=0;
const icon=(s,size)=>{k++;const t=s.replace(/id="(g\d)"/g,`id="$1_${k}"`).replace(/url\(#(g\d)\)/g,`url(#$1_${k})`);return `<svg viewBox="0 0 512 512"${size?` width="${size}" height="${size}"`:''}>${t}</svg>`};
const pal=c=>c.startsWith('linear')?`background:${c};-webkit-background-clip:text;background-clip:text;color:transparent`:`color:${c}`;
const word=(d,dark)=>`<span style="font-family:'Plus Jakarta Sans',sans-serif;font-weight:700;letter-spacing:-.03em;color:${dark?'#fff':'#0B0B0F'}">Motor<span style="${pal(dark?d.palDark:d.pal)}">Pal</span></span>`;
document.getElementById('cols').innerHTML=ideas.map(d=>`
<div class="col">
 <div class="hero" style="background:${d.hero}">${icon(d.svg)}</div>
 <div class="lock">${icon(d.svg)}${word(d,false)}</div>
 <div class="lock" style="background:${d.dark}">${icon(d.svg)}${word(d,true)}</div>
 <div class="sizes" style="padding-top:28px">${icon(d.svg,96)}${icon(d.svg,60)}${icon(d.svg,36)}</div>
 <div class="sw">${d.sw.map(([c,f])=>`<i style="background:${c};color:${f}">${c}</i>`).join('')}</div>
 <div class="cap"><small>${d.tag}</small><b>${d.name}</b><p>${d.why}</p></div>
</div>`).join('');
</script></body></html>
