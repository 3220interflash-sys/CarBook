<!doctype html>
<html><head><meta charset="utf-8">
<!-- MotorPal teaser clip, 1080 x 1920, 10 seconds: a scan line reveals neon instrument icons (calendar, chart,
     warning lights, fuel, battery) that beat like a heartbeat; then the neon pulse runs across and lights up
     "Coming soon" letter by letter. No logo or name.
     Every frame is drawn by seek(t); render-clip.js steps through it. Open in a browser to watch it play. -->
<link href="https://fonts.googleapis.com/css2?family=Raleway:wght@200&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1920px;overflow:hidden;background:#030B08}
#grid{position:absolute;inset:-80px;background:
  linear-gradient(rgba(0,196,127,.05) 1px,transparent 1px) 0 0/40px 40px,
  linear-gradient(90deg,rgba(0,196,127,.05) 1px,transparent 1px) 0 0/40px 40px}
#vig{position:absolute;inset:0;background:radial-gradient(900px 1100px at 50% 1000px,transparent 25%,rgba(3,11,8,.9) 80%)}
#scan{position:absolute;left:0;right:0;height:260px;background:linear-gradient(transparent,rgba(0,196,127,.07) 85%,rgba(124,245,200,.35) 99%,transparent);border-bottom:1.5px solid rgba(124,245,200,.6)}
#scan::after{content:"";position:absolute;left:0;right:0;bottom:-18px;height:36px;background:radial-gradient(60% 50% at 50% 50%,rgba(0,196,127,.35),transparent 70%)}
svg{position:absolute;inset:0}
#black{position:absolute;inset:0;background:#000;opacity:0}
</style></head>
<body>
<div id="grid"></div><div id="scan"></div>
<svg width="1080" height="1920" viewBox="0 0 1080 1920">
  <defs>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="3.2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="iglow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation=".6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="soft" filterUnits="userSpaceOnUse" x="0" y="0" width="2400" height="400"><feGaussianBlur stdDeviation="8"/></filter>
    <radialGradient id="halo"><stop offset="0" stop-color="#00C47F" stop-opacity=".22"/><stop offset="1" stop-color="#00C47F" stop-opacity="0"/></radialGradient>
    <radialGradient id="dotg"><stop offset="0" stop-color="#7CF5C8" stop-opacity=".9"/><stop offset="1" stop-color="#00C47F" stop-opacity="0"/></radialGradient>
    <radialGradient id="lamp" cx="0" cy=".5" r="1"><stop offset="0" stop-color="#7CF5C8" stop-opacity=".35"/><stop offset="1" stop-color="#00C47F" stop-opacity="0"/></radialGradient>
  </defs>
  <clipPath id="reveal"><rect id="revealRect" x="-200" y="-200" width="1480" height="0"/></clipPath>
  <g clip-path="url(#reveal)"><g id="icons"></g></g>
  <ellipse id="halo" cx="540" cy="960" rx="520" ry="300" fill="url(#halo)"/>
  <clipPath id="textReveal"><rect id="textRect" x="0" y="0" width="0" height="1920"/></clipPath>
  <!-- neon tube: a near-white core, a tight mint glow and a wide soft haze -->
  <filter id="tglow" filterUnits="userSpaceOnUse" x="0" y="800" width="1080" height="320"><feMorphology in="SourceAlpha" operator="dilate" radius=".45" result="thick"/><feFlood flood-color="#00E08F"/><feComposite in2="thick" operator="in" result="tube"/><feGaussianBlur in="tube" stdDeviation="1.4" result="g1"/><feGaussianBlur in="tube" stdDeviation="5" result="g2"/><feGaussianBlur in="tube" stdDeviation="14" result="g3"/><feMerge><feMergeNode in="g3"/><feMergeNode in="g2"/><feMergeNode in="g2"/><feMergeNode in="g1"/><feMergeNode in="g1"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <g clip-path="url(#textReveal)"><text id="soon" x="548" y="1004" text-anchor="middle" font-family="Raleway, system-ui, sans-serif" font-weight="200" font-size="40" letter-spacing="16" fill="#E6FFF4" filter="url(#tglow)"></text></g>
  <g id="world">
    <path id="trace" fill="none" stroke="#00C47F" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round" filter="url(#glow)"/>
    <path id="tail" fill="none" stroke="#00C47F" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" filter="url(#soft)"/>
    <path id="head" fill="none" stroke="#C9FFE9" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>
    <circle id="dotHalo" r="16" fill="url(#dotg)"/><circle id="dot" r="3.4" fill="#F0FFF8"/>
  </g>
</svg>
<div id="vig"></div><div id="black"></div>
<script>
const $ = id => document.getElementById(id);
// The pulse in the website's own coordinates (baseline y = 80), shown at 2x; "Coming soon" sits on its flat middle.
const SC = 2, CX = 963.5, BASE = 80, SCREEN_Y = 1020;
$('world').setAttribute('transform', `translate(${540 - CX * SC} ${SCREEN_Y - BASE * SC}) scale(${SC})`);
const ecg = x => `L${x} ${BASE} q6 -7 12 0 L${x + 22} ${BASE} l5 7 l7 -44 l7 54 l6 -17 L${x + 56} ${BASE} q11 -12 22 0`;
const D = `M640 ${BASE} ${ecg(694)} L1148 ${BASE} ${ecg(1148)} L1300 ${BASE}`;
['trace', 'tail', 'head'].forEach(id => $(id).setAttribute('d', D));
const L = $('head').getTotalLength();
const toScreen = wx => 540 + (wx - CX) * SC;
const WORD = 'Coming soon';
$('soon').innerHTML = [...WORD].map(ch => `<tspan>${ch === ' ' ? '&#160;' : ch}</tspan>`).join('');
const chars = [...$('soon').querySelectorAll('tspan')].map(el => ({ el }));

// Background icons: fine hairline instrument graphics on a 48 grid, each inside a thin ring with tick marks
// and a slowly turning arc, like a head-up display. Revealed by the scan line, then they flicker on and focus.
const IC = {
  calendar: '<rect x="7" y="10" width="34" height="31" rx="2.5"/><path d="M7 18h34M16 6v8M32 6v8"/>' +
    [0, 1, 2].map(r => [0, 1, 2, 3, 4].map(c => `<circle cx="${12.5 + c * 5.8}" cy="${23.5 + r * 5.6}" r=".75" class="f"/>`).join('')).join('') +
    '<rect x="28.6" y="32.4" width="6.4" height="5.6" rx="1"/>',
  chart: '<path d="M7 6v35h35"/><path d="M7 32h-2.5M7 23h-2.5M7 14h-2.5M16 41v2.5M25 41v2.5M34 41v2.5"/>' +
    '<path d="M7 23h35M7 14h35" stroke-dasharray="1 2.4" opacity=".5"/>' +
    '<path d="M9 36 C15 34 16 27 21.5 27.5 S29 19 33.5 18 S39 12 42 10.5 V41 H9 Z" class="a"/>' +
    '<path d="M9 36 C15 34 16 27 21.5 27.5 S29 19 33.5 18 S39 12 42 10.5"/>' +
    '<circle cx="21.5" cy="27.5" r="1.4" class="f"/><circle cx="33.5" cy="18" r="1.4" class="f"/><circle cx="42" cy="10.5" r="1.8" class="f"/>',
  engine: '<path d="M11 19h5v-4h12v4h4.5l4 4.5H40v-3h3.5v14H40v-3h-3.5l-5 5.5H16.5L11 31.5H8.5v3.5H5V21h3.5v4H11z"/><path d="M19 15v-3h6v3"/>',
  oil: '<path d="M5 23h15.5l3.5 3.5h8.5L41 21v12.5a2.5 2.5 0 0 1-2.5 2.5h-27A6.5 6.5 0 0 1 5 29.5z"/><path d="M12 23v-4.5h8M14 18.5v-3h4"/><path d="M41 21l3-1.5"/><path d="M44.5 25.5c0 1.8 1.6 2.6 1.6 4.2a1.6 1.6 0 0 1-3.2 0c0-1.6 1.6-2.4 1.6-4.2z"/>',
  battery: '<rect x="5" y="14" width="38" height="24" rx="2"/><path d="M11 14v-4h7v4M30 14v-4h7v4"/><path d="M11.5 26h7M30 26h7M33.5 22.5v7"/>',
  fuel: '<rect x="9" y="7" width="19" height="35" rx="2"/><path d="M6 42h25"/><rect x="13" y="12" width="11" height="8.5" rx="1"/><path d="M28 21h4.5a3 3 0 0 1 3 3v10.5a2.5 2.5 0 0 0 5 0V17l-5-6"/>'
};
// name, x, y, ring diameter in px, depth (0 near, 1 far)
// Placed unevenly on purpose, some running off the edges so only part of them shows.
const PLACE = [['calendar', 70, 450, 400, 0], ['chart', 820, 270, 290, 0], ['engine', 1030, 690, 330, 0],
  ['battery', 300, 1340, 250, 0], ['oil', 980, 1510, 400, 0], ['fuel', 90, 1830, 330, 0], ['chart', 470, 140, 170, 1]];
const ring = i => `<circle cx="24" cy="24" r="30" class="r"/>` +
  [0, 90, 180, 270].map(a => `<path d="M24 -8.5v4.5" transform="rotate(${a} 24 24)" class="r"/>`).join('') +
  Array.from({ length: 36 }, (_, j) => `<path d="M24 -6v${j % 3 ? 1 : 2}" transform="rotate(${j * 10} 24 24)" class="r t"/>`).join('') +
  `<path id="arc${i}" d="M24 -8 A32 32 0 0 1 51.7 8" class="arc"/><circle id="echo${i}" cx="24" cy="24" r="30" class="echo"/>`;
$('icons').innerHTML = PLACE.map(([n, x, y, d], i) =>
  `<filter id="bl${i}" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur id="blv${i}" stdDeviation="0"/></filter>` +
  `<g id="ic${i}" filter="url(#bl${i})"><g transform="translate(${x} ${y}) scale(${d / 64}) translate(-24 -24)" fill="none" stroke="#3EE0A4" stroke-linecap="round" stroke-linejoin="round">` +
  `<g class="ico" transform="translate(4.8 4.8) scale(.8)">${IC[n]}</g>${ring(i)}</g></g>`).join('');
document.querySelectorAll('#icons path, #icons rect, #icons circle').forEach(e => { e.setAttribute('vector-effect', 'non-scaling-stroke'); e.setAttribute('stroke-width', e.classList.contains('t') ? .8 : e.classList.contains('r') ? 1.1 : 1.9); });
document.querySelectorAll('#icons .f').forEach(e => { e.setAttribute('fill', '#3EE0A4'); e.setAttribute('stroke', 'none'); });
document.querySelectorAll('#icons .a').forEach(e => { e.setAttribute('fill', 'rgba(0,196,127,.12)'); e.setAttribute('stroke', 'none'); });
document.querySelectorAll('#icons .r').forEach(e => e.setAttribute('opacity', e.classList.contains('t') ? .35 : .45));
document.querySelectorAll('#icons .echo').forEach(e => { e.setAttribute('stroke', '#7CF5C8'); e.setAttribute('stroke-width', 1.4); e.setAttribute('vector-effect', 'non-scaling-stroke'); });
document.querySelectorAll('#icons .arc').forEach(e => { e.setAttribute('stroke', '#7CF5C8'); e.setAttribute('stroke-width', 2); });
const icons = PLACE.map((p, i) => ({ p, el: $('ic' + i), blur: $('blv' + i), arc: $('arc' + i), echo: $('echo' + i) }));
// one deliberate scan sweeps down and reveals the icons; a fainter one passes near the end
const SCAN = [[1.0, 4.3, 1], [7.7, 9.5, .45]];
const scanY = t => { for (const [a, b, st] of SCAN) if (t >= a && t <= b) return { y: -260 + 2400 * ((t - a) / (b - a)), st }; return null; };
const cl = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
const k = (t, t0, t1) => cl((t - t0) / (t1 - t0));
const out = p => 1 - Math.pow(1 - p, 3);
// the pulse comes in after the icons are up: it runs across in one pass, slower under the words
const T = { start: 4.5, textIn: 5.3, textOut: 6.9, end: 7.6, fade: 9.4, len: 10 };
let w0 = 0; while ($('head').getPointAtLength(w0).x < 790) w0 += 1;
let w1 = w0; while ($('head').getPointAtLength(w1).x < 1140) w1 += 1;
function headAt(t) {
  if (t < T.start) return -1;
  if (t < T.textIn) return w0 * k(t, T.start, T.textIn);
  if (t < T.textOut) return w0 + (w1 - w0) * k(t, T.textIn, T.textOut);
  if (t < T.end) return w1 + (L - w1) * k(t, T.textOut, T.end);
  return L + 200;
}
function dash(id, len, at, op) { const el = $(id); el.style.strokeDasharray = `${len} ${L * 3}`; el.style.strokeDashoffset = len - at; el.style.opacity = op; }
window.seek = function (t) {
  $('grid').style.opacity = .3 + .7 * out(k(t, 0, 1));
  $('grid').style.transform = `translate(${-(t * 16) % 40}px, 0)`;
  const sc = scanY(t);
  $('scan').style.opacity = sc ? sc.st : 0; if (sc) $('scan').style.top = (sc.y - 260) + 'px';
  const firstDone = t > SCAN[0][1];
  $('revealRect').setAttribute('height', firstDone ? 3000 : sc && t < SCAN[0][1] ? sc.y + 200 : 0);
  const h = headAt(t);
  // the line stays drawn behind the dot; the dot and its bright head make one pass
  $('trace').style.strokeDasharray = `${L} ${L}`;
  $('trace').style.strokeDashoffset = h < 0 ? L : L - Math.min(L, h);
  $('trace').style.opacity = h < 0 ? 0 : .75;
  const on = h >= 0 && h <= L;
  dash('head', 34, h, on ? 1 : 0); dash('tail', 170, h, on ? .6 : 0);
  if (on) { const p = $('head').getPointAtLength(Math.min(h, L - .1)); ['dot', 'dotHalo'].forEach(id => { $(id).setAttribute('cx', p.x); $(id).setAttribute('cy', p.y); }); }
  $('dot').style.opacity = on ? 1 : 0; $('dotHalo').style.opacity = on ? 1 : 0;
  // "Coming soon" lights up letter by letter as the dot passes under it, flares, then breathes gently
  const hx = on ? toScreen($('head').getPointAtLength(Math.min(h, L - .1)).x) : h > L ? 1200 : -10;
  $('textRect').setAttribute('width', Math.max(0, hx + 8));
  const lit = k(t, T.textOut, T.textOut + .5), breathe = t > T.textOut ? .85 + .15 * Math.sin((t - T.textOut) * 2.4) : 1;
  const flare = Math.exp(-Math.abs(t - T.textOut - .15) / .2);
  $('soon').style.opacity = Math.min(1, (.85 + .15 * out(lit)) * breathe + .25 * flare);
  // each letter flickers on like a neon tube the moment the dot passes under it
  const x0 = toScreen(790), x1 = toScreen(1140);
  chars.forEach((c, i) => {
    if (!c.cx || document.fonts.status !== 'loaded') { try { const e = $('soon').getExtentOfChar(i); c.cx = e.x + e.width / 2; } catch (_) { c.cx = 540; } }
    const age = t - (T.textIn + (T.textOut - T.textIn) * (c.cx - x0) / (x1 - x0));
    const f = age < 0 ? 0 : age < .3 ? [1, .15, .8, .25, 1, .6][Math.floor(age / .05)] ?? 1 : 1;
    c.el.setAttribute('fill-opacity', f);
  });
  $('halo').style.opacity = out(k(t, T.textIn, T.textOut + .3)) * (.8 + .2 * Math.sin(t * 2));
  // icons: revealed by the scan, a short hologram flicker, a rack focus from soft to sharp, then a slow float;
  // the whole layer keeps moving away from the viewer at a steady rate (shrinking toward the centre, softening
  // and dimming a little), while the reveal, flare, beat and ripple stay the same; far icons stay softer and dimmer
  const depth = t => 1.3 * Math.pow(.962, t), push = depth(t);
  $('icons').setAttribute('transform', `translate(540 960) scale(${push}) translate(-540 -960)`);
  const recede = 1 - push / 1.3;
  icons.forEach(({ p, el, blur, arc, echo }, i) => {
    const [, x, y, d, far] = p;
    // when the first scan reaches this icon, allowing for where the moving layer has put it on screen
    const at = sy => SCAN[0][0] + (SCAN[0][1] - SCAN[0][0]) * ((sy + 260) / 2400);
    let tr = at(y); tr = at(960 + (y - 960) * depth(tr)); tr = at(960 + (y - 960) * depth(tr));
    const ys = 960 + (y - 960) * push;
    const age = t - tr;
    let op = 0;
    if (age > 0) {
      const flick = age < .45 ? [1, .25, .9, .15, .8, 1, .55, 1][Math.floor(age / .055)] ?? 1 : 1;
      const flare = .5 * Math.exp(-age / .55);                                  // bright as the scan passes, then settles
      op = ((far ? .28 : .48) + flare) * flick;
      const s2 = scanY(t); if (s2 && s2.st < 1) op += .32 * Math.max(0, 1 - Math.abs(s2.y - ys) / 200);   // flare again on the second scan
    }
    // a heartbeat: lub-dub every 0.85 s once the icon has settled, slightly offset per icon
    const ph = ((t + i * .07) / .85) % 1, g = (c, w) => Math.exp(-Math.pow((ph - c) / w, 2));
    const beat = age > .9 ? g(.04, .055) + .7 * g(.24, .055) : 0;
    op += (far ? .14 : .34) * beat;
    el.style.opacity = Math.min(op, 1) * (1 - .35 * recede);
    // on each beat a ring ripples out from the icon and fades, like a monitor's pulse
    const rp = ((t + i * .07) / .85) % 1, rip = age > .9 ? rp : 0;
    echo.setAttribute('r', 30 + 16 * out(rip)); echo.style.opacity = age > .9 ? .6 * Math.pow(1 - rip, 2) : 0;
    blur.setAttribute('stdDeviation', (far ? 2.4 : 0) + 7 * (1 - out(cl(age / 1.2))) + 3 * recede);
    const fx = x + 5 * Math.sin(t * .45 + i), fy = y - 6 * Math.sin(t * .5 + i * 1.7), scl = 1 + .1 * beat;
    el.setAttribute('transform', `translate(${fx} ${fy}) scale(${scl}) translate(${-x} ${-y})`);
    arc.setAttribute('transform', `rotate(${t * (i % 2 ? -14 : 18) + i * 60} 24 24)`);
  });
  $('black').style.opacity = k(t, T.fade, T.len);
};
seek(0);
if (!location.search.includes('still')) { const st = performance.now(); (function f() { seek(((performance.now() - st) / 1000) % T.len); requestAnimationFrame(f); })(); }
</script>
</body></html>
